name: Build Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # Turns compiler/linker errors into annotations, readable from the API without the full log.
      - name: Report compile errors as annotations
        shell: bash
        run: echo "::add-matcher::.github/compile-errors.json"

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main

      - name: Upload the .geode file
        uses: actions/upload-artifact@v7
        with:
          name: trenmaxxrr-hacks-windows
          path: ${{ steps.build.outputs.build-output }}
